# Week 10 A3c: dashboard provisioning. One minimal evidence dashboard is
# auto-imported so "Grafana visualization" works after `docker compose up`;
# richer dashboards land in later slices. New JSON files dropped into the
# dashboards folder are picked up on the provider refresh interval.
apiVersion: 1

providers:
  - name: gateway
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
