name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify required project files exist
        run: |
          test -f AGENTS.md
          test -f MEMORY.md
          test -f REVIEW-CHECKLIST.md
          test -f Makefile
          test -f go.mod
          test -f go.sum
          test -f docker-compose.yml
          test -f db/sqlc.yaml
          test -f web/package.json
          test -f web/package-lock.json
          test -f scripts/dev-supervisor.sh
          test -f scripts/dev-supervisor_test.sh
          test -f docs/PRD-Production-Go-LLM-Gateway-MVP.md
          test -f docs/TechDesign-Production-Go-LLM-Gateway-MVP.md

      - name: Validate project JSON
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'agent-permissions.example.json',
            'web/package.json',
            'web/package-lock.json',
            'web/tsconfig.json'
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
          }
          NODE

      - name: Validate markdown fences
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = [
            'README.md',
            'AGENTS.md',
            'MEMORY.md',
            'REVIEW-CHECKLIST.md',
            'agent_docs',
            'docs'
          ];
          const files = [];

          function walk(target) {
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              for (const entry of fs.readdirSync(target)) {
                walk(path.join(target, entry));
              }
              return;
            }
            if (target.endsWith('.md')) files.push(target);
          }

          roots.forEach(walk);
          const unbalanced = files.filter((file) => {
            const fences = fs.readFileSync(file, 'utf8')
              .split(/\r?\n/)
              .filter((line) => line.trimStart().startsWith('```'));
            return fences.length % 2 !== 0;
          });

          if (unbalanced.length) {
            console.error(`Unbalanced markdown fences:\n${unbalanced.join('\n')}`);
            process.exit(1);
          }
          NODE

      - name: Reject unresolved project placeholders
        run: |
          if grep -rEn \
            --exclude=package-lock.json \
            --exclude='*.sql.go' \
            '<TODO|TBD_SOURCE_ANCHOR|TODO_AI_WORKFLOW_UPGRADE|\[your-email\]' \
            AGENTS.md MEMORY.md Makefile agent_docs docs cmd internal db web scripts; then
            echo 'ERROR: unresolved project placeholder found'
            exit 1
          fi

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA..$HEAD_SHA"
          else
            git diff-tree --check --root -r "$HEAD_SHA"
          fi

  backend:
    name: Go backend and sqlc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Generate sqlc code
        run: make generate

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Typecheck backend and vet sqlc queries
        run: make typecheck-backend

      - name: Lint backend
        run: make lint-backend

      - name: Test backend
        run: make test-backend

      - name: Test development supervisor lifecycle
        run: |
          command -v setsid
          make test-dev-supervisor

      - name: Test backend with race detector
        run: make race

      - name: Build backend
        run: make build-backend

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: make web-install

      - name: Test frontend
        run: make test-web

      - name: Typecheck frontend
        run: make typecheck-web

      - name: Lint frontend
        run: make lint-web

      - name: Build frontend
        run: make build-web

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable
      CREDENTIAL_MASTER_KEY: Y2ktY3JlZGVudGlhbC1tYXN0ZXIta2V5LTAwMDAwMDE=
      SESSION_TOKEN_PEPPER: Y2ktc2Vzc2lvbi10b2tlbi1wZXBwZXItMDAwMDAwMDE=
      VIRTUAL_KEY_PEPPER: Y2ktdmlydHVhbC1rZXktcGVwcGVyLTAwMDAwMDAwMDE=
      PUBLIC_CONSOLE_URL: http://127.0.0.1:5173
      GITHUB_CLIENT_ID: ci-placeholder-client
      GITHUB_CLIENT_SECRET: ci-placeholder-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run PostgreSQL integration tests
        run: make integration

      - name: Stop PostgreSQL
        if: always()
        run: make postgres-down
