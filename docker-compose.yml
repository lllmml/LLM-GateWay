name: production-go-llm-gateway

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  # Week 9 Slice B local Redis, pinned to the exact image the distributed
  # rate-limiter integration tests run against (ADR-018 D3: Redis TIME +
  # writes inside the mutating Lua are verified on this version). Ephemeral
  # (no persistence): Redis is never a source of truth in this project.
  redis:
    image: redis:7.4.11-alpine
    # --enable-debug-command yes is required by the deterministic command-level
    # context-interruption integration test (DEBUG SLEEP). Local/dev only.
    command: ["redis-server", "--appendonly", "no", "--enable-debug-command", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20

  # Week 10 A3a local observability stack (ADR-019 D10). The Gateway runs on
  # the host during local development; collector/tempo/prometheus/grafana live
  # here. All host-published ports bind 127.0.0.1 only. The images are
  # distroless (no shell/wget), so these services carry NO in-container
  # HEALTHCHECK; readiness is verified host-side (Tempo /ready plus the real
  # trace round-trip in `make observability-evidence`).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      # Host Gateway OTLP gRPC export (dev-only; bind 127.0.0.1).
      - "127.0.0.1:4317:4317"
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      # Query API: Grafana reaches it over the internal network; the host
      # binding is for A3a evidence and the integration test (127.0.0.1).
      - "127.0.0.1:3200:3200"
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  # Prometheus PULLS the host Gateway's private Ops plane /metrics (A1) via
  # host.docker.internal. Metrics are never pushed and never enter the
  # Collector. host port 9091 avoids the Gateway Ops listener's :9090.
  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana with datasource provisioning only (dashboards deferred to a later
  # slice; the gateway overview below is the minimal evidence dashboard).
  # Admin credentials are local-dev only (env interpolation, no committed
  # secret value) and never appear in .env.example.
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  grafana-data:
